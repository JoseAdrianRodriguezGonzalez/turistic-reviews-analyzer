[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "turistic-review"
version = "0.1.0"
description = "Proyecto NLP con modelado de tópicos y embeddings"
authors = [
    { name = "Tu Nombre" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # ── Core científico ─────────────────────────
    "numpy>=1.24,<2.0",
    "pandas>=2.0,<3.0",
    "scipy>=1.11",

    # ── Machine Learning ────────────────────────
    "scikit-learn>=1.3,<1.6",
    "joblib>=1.3",

    # ── Deep Learning ───────────────────────────
    "torch>=2.0",
    "transformers>=4.35,<5.0",
    "sentence-transformers>=2.7,<3.5",

    # ── Modelado de tópicos ─────────────────────
    "bertopic>=0.16",
    "hdbscan>=0.8.33",
    "umap-learn>=0.5.6",

    # ── NLP general ─────────────────────────────
    "sentencepiece>=0.1.99",
    "spacy>=3.7,<3.9",
    "nltk>=3.8",
    "yake>=0.4.8",
    "langdetect>=1.0.9",
    "unidecode>=1.3",
    "rapidfuzz>=3.0",

    # ── Sentimiento ─────────────────────────────
    "pysentimiento>=0.7",

    # ── Visualización ───────────────────────────
    "plotly>=5.14",
    "matplotlib>=3.7,<3.12",
    "seaborn>=0.13",
    "networkx>=3.1",
    "pyvis>=0.3",

    # ── LLM local ───────────────────────────────
    "llama-cpp-python>=0.3.0",

    # ── Utilidades ──────────────────────────────
    "tqdm>=4.65",
    "pyyaml>=6.0",
]
[tool.setuptools]
packages = [
"lib",
"pipeline",
"analysis",
"clustering",
"translation",
"preprocessing",
"visualization",
"topic_enrichment",
"semantic_expression",
"feature_engineering"
]
[project.optional-dependencies]

legacy = [
    "torch>=2.3,<2.6",
    "transformers>=4.35,<4.42",
    "sentence-transformers>=2.7,<3.1",
    "bertopic>=0.16,<0.17",
    "matplotlib>=3.7,<3.10",
    "llama-cpp-python>=0.2.90,<0.3.2"
]

cuda121 = []
cuda118 = []
